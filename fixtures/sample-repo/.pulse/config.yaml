version: 1
base_branch: main

paths:
  artifacts: docs/pulse
  audit: .pulse/overrides.log.md
  reviews: .pulse/reviews

ship:
  target: vercel
  test_command: pnpm test

guard:
  spec_conformance:
    enabled: true
    severity_on_fail: error
  security_regression:
    enabled: true
    severity_on_fail: error
    banned_patterns:
      - "Authorization: Bearer dev-token"
    secret_scan: true
  convention_drift:
    enabled: true
    severity_on_fail: warning
    rules:
      - "Service files under src/services use kebab-case filenames."
      - "Database queries are made through the `db` client, not raw `pg`."
      - "Imports never reach across feature boundaries (no ../../../feature)."
  anti_pattern_repetition:
    enabled: true
    threshold: 3
    severity_on_fail: warning
  performance_pitfalls:
    enabled: true
    severity_on_fail: error
  test_integrity:
    enabled: true
    severity_on_fail: error
  dependency_hygiene:
    enabled: true
    allowlist_licenses: [MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause]
    severity_on_fail: error
  data_api_safety:
    enabled: true
    severity_on_fail: error

overrides:
  require_second_engineer: [security_regression, data_api_safety]
  weekly_threshold_per_engineer: 5
